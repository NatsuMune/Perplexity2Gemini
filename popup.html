<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Perplexity to Gemini</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --border: #eaeaea;
      --accent: #000000;
      --text-muted: #666666;
      --badge-bg: #f5f5f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #ffffff;
        --border: #333333;
        --accent: #ffffff;
        --text-muted: #888888;
        --badge-bg: #1c1c1e;
      }
    }
    body {
      width: 320px;
      padding: 20px;
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      box-sizing: border-box;
    }
    h3 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 6px 0;
      letter-spacing: -0.01em;
    }
    p.desc {
      color: var(--text-muted);
      font-size: 13px;
      margin: 0 0 16px 0;
      line-height: 1.4;
    }
    .privacy-notice {
      background-color: var(--badge-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--fg);
    }
    .privacy-notice header {
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .privacy-notice p {
      margin: 0;
      color: var(--text-muted);
    }
    button {
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: 0 16px;
      height: 38px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #ef4444;
      line-height: 1.4;
    }
  </style>
  <script src="popup.js"></script>
</head>
<body>
  <h3>Perplexity Exporter</h3>
  <p class="desc">Extract your chat history and projects into a Gemini-compatible file.</p>
  
  <div class="privacy-notice">
    <header>🔒 100% Local & Private</header>
    <p>Extraction runs entirely within your browser. Your chats and personal data are never sent to external servers.</p>
  </div>

  <button id="exportBtn">Start Extraction</button>
  <div id="status"></div>
</body>
</html>
