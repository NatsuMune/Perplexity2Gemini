<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Migrating to Gemini</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --border: #eaeaea;
      --accent: #1a73e8;
      --text-muted: #666666;
      --badge-bg: #f8f9fa;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #ffffff;
        --border: #333333;
        --accent: #8ab4f8;
        --text-muted: #888888;
        --badge-bg: #1c1c1e;
      }
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    p.subtitle {
      color: var(--text-muted);
      margin: 0 0 24px 0;
      font-size: 14px;
    }
    .status-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 16px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
    .current-task {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-container {
      margin-top: 24px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--text-muted);
      max-height: 200px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .log-entry { margin-bottom: 4px; }
    .success-text { color: #10b981; }
    .error-text { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Migrating Projects to Gemini</h1>
    <p class="subtitle">Automating Notebook creation and organizing your threads...</p>
    
    <div class="status-card">
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
        <span style="color: var(--text-muted);">Projects</span>
        <span style="font-weight: 500;" id="stat-projects">0 / 0</span>
      </div>
      
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      
      <div class="current-task" id="current-task">Initializing...</div>
    </div>
    
    <div class="log-container" id="log-container"></div>
  </div>

  <script src="migrate.js"></script>
</body>
</html>
